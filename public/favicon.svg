<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Permit Rulebook">
  <!-- Identity B, chosen by the human 2026-09-07: the tilted PR stamp, enlarged
       to fill its frame. The letters take the whole square, the frame is as thin
       as the size allows, and the tilt is the stamp's own (-6deg). Accepted cost,
       stated at the choice: at 16 px the tilt costs a little sharpness.
       The square is inset so its rotated corners stay inside the box.

       Option C, chosen by the human 2026-09-08 from docs/spine/design: no
       full-canvas square. The canvas is transparent and the paper is inside the
       tilted frame, so the tab shows a stamp rather than a cream tile with a
       stamp on it — which is what it looked like on a dark tab strip. -->
  <g transform="rotate(-6 32 32)">
    <rect x="4.5" y="4.5" width="55" height="55" fill="#f1eee4" stroke="#8c2b2b" stroke-width="3"/>
    <text x="32" y="33" fill="#8c2b2b" text-anchor="middle" dominant-baseline="middle"
          font-family="Consolas, 'DejaVu Sans Mono', ui-monospace, monospace"
          font-weight="700" font-size="40" letter-spacing="-1.6">PR</text>
  </g>
</svg>
