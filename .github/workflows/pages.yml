name: deploy

# Decision 6: the site is static, on GitHub Pages, out of the repository it
# lives in. One vendor, zero cost, nothing server-side — which this product has
# promised never to need. The cost is stated: no headers we control and no
# redirects. If a CSP or a redirect ever matters, Cloudflare Pages is the move.
#
# Pages is on, with GitHub Actions as the source. `SITE_URL` decides both where
# the site thinks it lives and, from that URL's own path, the base every
# internal link is written under — a project repository is served at
# `https://oytunonal.github.io/permit-rulebook/`, and a root-absolute link there
# lands outside the site. The repository variable is the human's to set; the
# fallback below is the Pages URL, so a run with nothing set still deploys a
# correct site.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a run already in flight finishes rather than being
# cancelled: a half-deployed static site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://oytunonal.github.io/permit-rulebook/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The site reads the dataset as a `file:` dependency, so the two have to
      # sit beside each other on disk. The site therefore lands in a
      # subdirectory of its own, or that `..` would climb out of the workspace.
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          path: site

      # Where the data has to end up is a fact the site's own manifest already
      # holds. It is read from there rather than typed here: the directory still
      # carries the working name — the folders are the human's to rename — and a
      # workflow that spells it out is one more place to keep in step.
      - name: Where the manifest expects the data
        id: data
        working-directory: site
        run: |
          path=$(node -p "require('./package.json').dependencies['permit-rulebook-data'].replace(/^file:/, '')")
          echo "dir=$(basename "$path")" >> "$GITHUB_OUTPUT"

      - name: Check out the data
        uses: actions/checkout@v4
        with:
          repository: OytunOnal/permit-rulebook-data
          path: ${{ steps.data.outputs.dir }}

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Build and check the dataset package
        working-directory: ${{ steps.data.outputs.dir }}
        run: |
          npm ci
          npm run check

      - name: Install
        working-directory: site
        run: npm ci

      # The build comes BEFORE the tests, and that order is load-bearing: the
      # suite drives a real browser over `dist/`, and its own guard refuses to
      # skip that check in CI. Running the tests first failed with
      # "CI cannot skip: no dist/" — the guard working exactly as written
      # (2026-09-08).
      #
      # `npm run build` is `astro check && astro build`. The dataset is
      # validated at the build boundary too, so an invalid one kills the deploy
      # rather than shipping a page with a value nobody sourced.
      - name: Build
        working-directory: site
        run: npm run build

      # Now the suite, which includes the browser smoke over `astro dev` and
      # over the `dist/` just built. There is no separate `npm run smoke` step:
      # it would drive the same two surfaces a second time for the same answer.
      # `npm run smoke` stays available for a person at a terminal.
      - name: Test
        working-directory: site
        run: npm test

      - name: The first minute's assets are committed and still true
        working-directory: site
        run: npm run assets:check

      # The site is served from a subpath unless a custom domain is bound, so
      # every internal link is written under a base. This builds under one and
      # reads every emitted page back.
      - name: Correct under a subpath
        working-directory: site
        run: npm run check:base

      # The invariant, measured rather than argued: a real 390 px viewport over
      # every built page.
      - name: Every control reaches the tap floor at 390 px
        working-directory: site
        run: npm run measure:taps

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
