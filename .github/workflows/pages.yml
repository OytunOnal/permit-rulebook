name: deploy

# Decision 6: the site is static, on GitHub Pages, out of the repository it
# lives in. One vendor, zero cost, nothing server-side — which this product has
# promised never to need. The cost is stated: no headers we control and no
# redirects. If a CSP or a redirect ever matters, Cloudflare Pages is the move.
#
# Pages is on, with GitHub Actions as the source. `SITE_URL` decides both where
# the site thinks it lives and, from that URL's own path, the base every
# internal link is written under — a project repository is served at
# `https://oytunonal.github.io/permit-rulebook/`, and a root-absolute link there
# lands outside the site. The repository variable is the human's to set; the
# fallback below is the Pages URL, so a run with nothing set still deploys a
# correct site.

# What triggers a rebuild, and why there are four of them.
#
# The pages bake "RULES READ <date>" and the social card says "checked daily".
# Both of those are claims about the DATA repository, and the daily source watch
# commits there, not here — so a push trigger alone let the published card go
# stale while the promise printed on it stayed put (2026-09-08).
#
# `schedule` is the floor: it rebuilds even when nothing signals us. 06:40 UTC
# is picked to sit comfortably after the data repository's source watch, which
# starts at 05:17 UTC and then spends several minutes on an install, a build,
# the network fetch of every watched source, and a commit — and GitHub delays
# scheduled runs under load, on both sides. An hour and twenty minutes of slack
# means the site builds against the state the watch has just committed, not the
# one before it.
#
# `repository_dispatch` is the fast path: the watch fires a `dataset-updated`
# event the moment it actually commits new state, so a real change reaches the
# published page in minutes instead of waiting for tomorrow's cron.
on:
  push:
    branches: [master]
    # The ledgers and the design record are not the product: a STATUS line pushed
    # while a deploy is running cancelled that deploy (2026-09-09, c5c6ef9), and
    # every ledger push rebuilt a site nothing in it had changed. Product paths
    # only (steward-48).
    paths-ignore:
      - "STATUS.md"
      - "KANBAN.md"
      - "DECISIONS.md"
      - "CONTEXT.md"
      - "docs/**"
  schedule:
    - cron: "40 6 * * *" # daily, 06:40 UTC — after the data watch at 05:17 UTC
  repository_dispatch:
    types: [dataset-updated]
  workflow_dispatch:

# The floor for the whole workflow, and the ceiling for every job that does not
# raise it: a build that only reads two repositories needs nothing else. The
# deploy job asks for the two Pages tokens where it needs them, and nowhere
# above (Spine steward-40, 2026-09-08).
permissions:
  contents: read

# One deploy at a time, and a run already in flight finishes rather than being
# cancelled: a half-deployed static site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://oytunonal.github.io/permit-rulebook/' }}

jobs:
  build:
    runs-on: ubuntu-24.04 # pinned 2026-09-24; ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and the move is a dated roadmap item
    # Reads two repositories and writes nothing: the one line that records which
    # data commit deployed is written by the `pin` job, which is the only job
    # holding a write token (Standards review, 2026-09-08).
    permissions:
      contents: read
    outputs:
      built: ${{ steps.built.outputs.sha }}
      version: ${{ steps.built.outputs.version }}
      locked: ${{ steps.data.outputs.locked }}
      first_attempt: ${{ steps.data.outputs.first_attempt }}
      urls: ${{ steps.urls.outputs.urls }}
    steps:
      # The site reads the dataset as a `file:` dependency, so the two have to
      # sit beside each other on disk. The site therefore lands in a
      # subdirectory of its own, or that `..` would climb out of the workspace.
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          path: site

      # Where the data has to end up is a fact the site's own manifest already
      # holds. It is read from there rather than typed here: the directory still
      # carries the working name — the folders are the human's to rename — and a
      # workflow that spells it out is one more place to keep in step.
      - name: Where the manifest expects the data, and which commit of it
        id: data
        working-directory: site
        env:
          # Through the environment, never interpolated into the script body.
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: |
          path=$(node -p "require('./package.json').dependencies['permit-rulebook-data'].replace(/^file:/, '')")
          echo "dir=$(basename "$path")" >> "$GITHUB_OUTPUT"
          # `data.lock` names the data commit this site is built against, and a
          # push or a manual run builds against exactly that. The sibling used
          # to float at its own origin HEAD, which broke the rollback: re-running
          # the last green deploy tested old site code against new data and
          # failed, and any data commit could break this deploy without a single
          # change here (found by trying it, 2026-09-08).
          #
          # The daily schedule and the watch's dispatch are the deliberate
          # exception — they exist to build against the newest data — and they
          # write the SHA they used back into the lock when the run goes green,
          # so the lock always names a combination that actually deployed.
          locked=$(sed -n 's/^sha=//p' data.lock)
          # A RERUN of a scheduled or dispatched run keeps its event name, so it
          # would build against today's data and then pin it — the float this
          # lock exists to end, on the trigger that fires daily. Only a first
          # attempt may advance the lock (Spec review, 2026-09-08).
          first_attempt=$([ "$RUN_ATTEMPT" = "1" ] && echo yes || echo no)
          case "$EVENT_NAME:$first_attempt" in
            schedule:yes)            ref="" ;;
            repository_dispatch:yes) ref="$PAYLOAD_SHA" ;;
            *)                       ref="$locked" ;;
          esac
          # The dispatch's payload is a stranger's string until it is checked.
          if [ "$EVENT_NAME:$first_attempt" = "repository_dispatch:yes" ]; then
            case "$ref" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
              *) echo "::error::the dispatch carried no 40-hex commit — refusing to check anything out."; exit 1 ;;
            esac
          fi
          if [ -z "$ref" ] && [ "$EVENT_NAME:$first_attempt" != "schedule:yes" ]; then
            echo "::error::data.lock names no sha — run npm run data:pin and commit it."
            exit 1
          fi
          echo "locked=$locked" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "first_attempt=$first_attempt" >> "$GITHUB_OUTPUT"

      - name: Check out the data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          repository: OytunOnal/permit-rulebook-data
          path: ${{ steps.data.outputs.dir }}
          # Empty on the daily schedule, which means the default branch.
          ref: ${{ steps.data.outputs.ref }}
          # The whole history, because the suite proves the built data contains
          # the pinned commit — an ancestry question, unanswerable in a shallow
          # clone. A push builds the lock itself and never noticed; the first
          # dispatch built a newer commit and the guard failed on the missing
          # object rather than on a real gap (CI 2026-09-09).
          fetch-depth: 0

      - name: Which data commit this run is building
        id: built
        run: |
          dir="${{ steps.data.outputs.dir }}"
          sha=$(git -C "$dir" rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./$dir/data/dataset.json').dataset_version")" >> "$GITHUB_OUTPUT"
          echo "Building against data $sha (lock says ${{ steps.data.outputs.locked }})"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with: { node-version: 22 }

      - name: Build and check the dataset package
        working-directory: ${{ steps.data.outputs.dir }}
        run: |
          npm ci
          npm run check

      - name: Install
        working-directory: site
        run: npm ci

      # The build comes BEFORE the tests, and that order is load-bearing: the
      # suite drives a real browser over `dist/`, and its own guard refuses to
      # skip that check in CI. Running the tests first failed with
      # "CI cannot skip: no dist/" — the guard working exactly as written
      # (2026-09-08).
      #
      # `npm run build` is `astro check && astro build`. The dataset is
      # validated at the build boundary too, so an invalid one kills the deploy
      # rather than shipping a page with a value nobody sourced.
      - name: Build
        working-directory: site
        run: npm run build

      # Now the suite, which includes the browser smoke over `astro dev` and
      # over the `dist/` just built. There is no separate `npm run smoke` step:
      # it would drive the same two surfaces a second time for the same answer.
      # `npm run smoke` stays available for a person at a terminal.
      - name: Test
        working-directory: site
        run: npm test

      - name: The first minute's assets are committed and still true
        working-directory: site
        run: npm run assets:check

      # The site is served from a subpath unless a custom domain is bound, so
      # every internal link is written under a base. This builds under one and
      # reads every emitted page back.
      - name: Correct under a subpath
        working-directory: site
        run: npm run check:base

      # The invariant, measured rather than argued: a real 390 px viewport over
      # every built page.
      - name: Every control reaches the tap floor at 390 px
        working-directory: site
        run: npm run measure:taps

      # The addresses the deploy will announce to Bing (the `indexnow` job,
      # below). This is the only job with `dist/` on disk — the deploy sees the
      # Pages artifact and nothing else — so the list is read here, from the
      # sitemap the build just wrote, and travels as a job output: one JSON
      # array of a few kilobytes, well under the megabyte outputs allow, and no
      # second artifact to upload and fetch.
      - name: The addresses the deploy will announce
        id: urls
        working-directory: site
        run: |
          urls=$(grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's/<loc>//' | jq -R . | jq -sc .)
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
          echo "$(echo "$urls" | jq length) addresses in the sitemap"

      # Why a deploy carries the previous generation's assets at all, the one
      # generation it keeps, and the ceilings it holds an origin to: all of it
      # is in `site/scripts/carry-assets.mjs`'s own header, which is the place
      # it is kept true.
      #
      # What the step is: the last thing before the artifact is sealed, because
      # it adds files to `dist/` and a file carried after the upload is a file
      # nobody deploys — this is where that reason is kept, and the case in
      # `tests/pipeline.test.ts` that pins this step's position points here.
      # Two kinds of file: the assets it carries forward, and `asset-digests.txt`,
      # the list of what THIS build made, which is the only thing the next
      # deploy will check a carried byte against. No new action and no new
      # token — `node`, which this job already has, and `SITE_URL`, the one
      # place the site's address is decided. The script catches every failure
      # and exits 0 on every path, so there is nothing here for
      # `continue-on-error` to catch.
      #
      # The address arrives as an environment VALUE and the command line is
      # empty, which is not a style choice: the script reads any `--name value`
      # as a flag, so a repository variable spliced into argv could turn the
      # whole mechanism off with every deploy still green. The reading is in
      # the script's own header, under "Where the address comes from". Nothing
      # may be appended to the `run:` line either, for the reason
      # `tests/pipeline.test.ts` keeps beside its verbatim pin of this block.
      - name: Carry the live site's assets forward, so a cached page still finds them
        working-directory: site
        env:
          CARRY_ORIGIN: ${{ env.SITE_URL }}
        run: node scripts/carry-assets.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (upload-artifact v7, node24)
        with:
          path: site/dist

  # The lock records a combination that actually built and deployed. Only the
  # two triggers that build against the newest data may move it, and only on a
  # first attempt: a rerun keeps its event name, and would otherwise pin
  # whatever the data repository happens to be at today (Spec review,
  # 2026-09-08).
  pin:
    needs: [build, deploy]
    if: |
      github.run_attempt == 1
      && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch')
      && needs.build.outputs.built != needs.build.outputs.locked
    runs-on: ubuntu-24.04 # pinned 2026-09-24; ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and the move is a dated roadmap item
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - name: Record the data commit that just proved itself
        env:
          BUILT: ${{ needs.build.outputs.built }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          case "$BUILT" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::the build reported no 40-hex data commit."; exit 1 ;;
          esac
          sed -i "s/^sha=.*/sha=$BUILT/" data.lock
          sed -i "s/^dataset_version=.*/dataset_version=$VERSION/" data.lock
          # The canonical bot, so an automated commit is attributed to the
          # automation and not to whichever account owns a noreply login.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.lock
          git commit -m "data.lock: built and deployed against $BUILT ($VERSION)"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-24.04 # pinned 2026-09-24; ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and the move is a dated roadmap item
    # The only job that publishes: an artifact upload and the OIDC token Pages
    # signs the deployment with.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (node24)

  # Bing reads the sitemap on its own clock, and this site rebuilds daily and
  # takes several slices a week. IndexNow is the protocol Bing (with Yandex,
  # Naver and Seznam) accepts for "these addresses changed": a key file at the
  # site's root — `public/<key>.txt`, whose name is the key — and one POST per
  # deploy carrying every address in the sitemap, as
  # `{host, key, keyLocation, urlList}` to https://api.indexnow.org/indexnow.
  # No account, no secret: the key is public by the protocol's design, and the
  # worst a stranger can do with it is submit our own addresses to Bing
  # (docs/spine/threats.md). The key is read from the committed file, never
  # typed here, so there is one copy of it (s24, 2026-09-17).
  #
  # Only a real deploy is announced — the gate `pin` uses, minus its
  # data-commit condition, plus the push: not a `workflow_dispatch` preview,
  # not a re-run that deployed nothing. And a notification must never fail a
  # deploy: the job may fail without failing the run, and the step exits 0
  # whatever Bing answers, printing the status for the log to keep.
  indexnow:
    needs: [build, deploy]
    if: |
      success()
      && github.run_attempt == 1
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch')
    runs-on: ubuntu-24.04 # pinned 2026-09-24; ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and the move is a dated roadmap item
    continue-on-error: true
    # Reads the key file out of the checkout; writes nothing anywhere.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - name: Tell Bing which addresses changed
        env:
          # Through the environment, never interpolated into the script body.
          URLS: ${{ needs.build.outputs.urls }}
        run: |
          # Exactly one `public/<32 hex>.txt`, whose name is the key and whose
          # content says so again. Anything else is a warning, not a failure.
          files=$(ls public | grep -E '^[0-9a-f]{32}\.txt$' || true)
          if [ "$(printf '%s\n' "$files" | grep -c .)" != "1" ]; then
            echo "::warning::expected exactly one public/<32 hex>.txt IndexNow key file, found ${files:-none} — nothing sent."
            exit 0
          fi
          key=$(cat "public/$files")
          if [ "$key" != "${files%.txt}" ]; then
            echo "::warning::the IndexNow key file's content is not its name — nothing sent."
            exit 0
          fi
          if [ -z "$URLS" ] || [ "$URLS" = "[]" ]; then
            echo "::warning::the build reported no addresses — nothing sent."
            exit 0
          fi
          # The host and the key's address follow SITE_URL, as every address
          # in the sitemap does — the protocol wants all three to agree.
          host=$(printf '%s' "$SITE_URL" | sed -E 's#^https?://([^/]+).*#\1#')
          body=$(jq -nc --arg host "$host" --arg key "$key" --arg keyLocation "${SITE_URL%/}/${key}.txt" --argjson urlList "$URLS" '$ARGS.named')
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' --data "$body" https://api.indexnow.org/indexnow || echo "no answer")
          echo "IndexNow answered $status to $(echo "$URLS" | jq length) addresses on $host"
          exit 0
